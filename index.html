<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor</title>
    <!-- Load Filerobot Image Editor CDN -->
    <script src="https://scaleflex.it"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #editor-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="editor-container"></div>

<script>
    // Initialize the Filerobot Image Editor
    const ImageEditor = new window.FilerobotImageEditor({
        elementId: 'editor-container',
        source: 'https://scaleflex.airstore.io/demo/stephen-walker-unsplash.jpg', // Replace with your default image URL
        onSave: (imageObject, imageDesignState) => {
            console.log('Saved Image Data:', imageObject);
            alert('Image saved successfully!');
        },
        onClose: () => {
            alert('Editor closed');
        }
    });

    // Open the editor immediately when the page loads
    ImageEditor.open();
</script>

</body>
</html>
